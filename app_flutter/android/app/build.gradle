plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Firma de release: las credenciales viven en android/key.properties, que NO
// está en git. Si el archivo no existe (una máquina recién clonada, o CI sin
// secretos), el release cae a la llave de depuración para que `flutter run
// --release` siga funcionando — pero un APK así lo rechaza Google Play.
def clavesRelease = new Properties()
def archivoClaves = rootProject.file("key.properties")
if (archivoClaves.exists()) {
    clavesRelease.load(new FileInputStream(archivoClaves))
}

android {
    namespace = "com.subirfactura.app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.subirfactura.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (archivoClaves.exists()) {
                keyAlias = clavesRelease["keyAlias"]
                keyPassword = clavesRelease["keyPassword"]
                storeFile = file(clavesRelease["storeFile"])
                storePassword = clavesRelease["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = archivoClaves.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
