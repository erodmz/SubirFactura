name: CI

# Solo en PRs y ramas de trabajo: en main, el workflow de Deploy ya corre
# lint/build/test antes de construir, así no se paga dos veces lo mismo.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # La versión sale del campo packageManager del package.json raíz

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test
